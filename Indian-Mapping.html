<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indian Mapping</title>
<style>
  :root {
    --bg: #f2f2f0;
    --btn-bg: rgba(255, 255, 255, 0.92);
    --btn-fg: #1c1c1e;
    --btn-border: rgba(0, 0, 0, 0.15);
  }
  :root[data-theme="dark"] {
    --bg: #15171a;
    --btn-bg: rgba(30, 32, 36, 0.92);
    --btn-fg: #f2f2f0;
    --btn-border: rgba(255, 255, 255, 0.2);
  }

  html, body { height: 100%; margin: 0; background: var(--bg); }

  .map {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
  }
  .map.active { display: block; }

  #toggle {
    position: fixed;
    top: 32px;
    right: 12px;
    z-index: 1000;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
    -webkit-tap-highlight-color: transparent;
  }
  #toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  #toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #toggle .sun { display: none; }
  :root[data-theme="dark"] #toggle .sun { display: block; }
  :root[data-theme="dark"] #toggle .moon { display: none; }
</style>
</head>
<body>

<button id="toggle" type="button" aria-label="Switch to dark map" title="Toggle dark mode">
  <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<iframe id="light" class="map" title="Indian Mapping (light)"
  data-src="https://umap.openstreetmap.fr/en/map/indian-mapping_1476577?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=true&fullscreenControl=null&locateControl=false&captionControl=null&printControl=false&measureControl=false"
  allowfullscreen></iframe>

<iframe id="dark" class="map" title="Indian Mapping (dark)"
  data-src="https://umap.openstreetmap.fr/en/map/indian-mapping-dark_1476670?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=true&fullscreenControl=null&locateControl=false&captionControl=null&printControl=false&measureControl=false"
  allowfullscreen></iframe>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('toggle');
  var frames = { light: document.getElementById('light'), dark: document.getElementById('dark') };

  function apply(theme) {
    root.setAttribute('data-theme', theme);
    var other = theme === 'dark' ? 'light' : 'dark';
    // Load the iframe only when first needed
    if (!frames[theme].src) frames[theme].src = frames[theme].dataset.src;
    frames[theme].classList.add('active');
    frames[other].classList.remove('active');
    btn.setAttribute('aria-label', 'Switch to ' + other + ' map');
  }

  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  var manual = false;

  // Start from the device's setting
  apply(mq && mq.matches ? 'dark' : 'light');

  // Follow device changes until the person uses the toggle
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) {
      if (!manual) apply(e.matches ? 'dark' : 'light');
    });
  }

  btn.addEventListener('click', function () {
    manual = true;
    apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
